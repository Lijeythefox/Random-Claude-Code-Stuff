<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Dream Lab Walk-through</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a late-night tour of your own warm, lived-in workshop
   IDEA: a site-plan HUD laid over a timber-and-steel warehouse lit by Edison bulbs

   COLOUR and TYPE: espresso #1c1612, burnt orange #f08a3c, brass and leather browns; Archivo wide for names, Inter for the rest
   LAYOUT: canvas fills the screen; zone card top-left, minimap top-right, quick-travel strip along the bottom */
:root{color-scheme:dark;--bg:#1c1612;--ink:#f6efe6;--panel:rgba(28,22,18,.84);--accent:#f08a3c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:2}
#card{top:12px;left:12px;background:var(--panel);border-left:4px solid var(--accent);padding:10px 14px 11px;border-radius:6px;max-width:min(340px,calc(100vw - 190px));pointer-events:none}
#card .t{font-size:13px;color:#c9b9a8}
#zone{font:800 22px/1.1 Archivo,Inter,sans-serif;font-stretch:112%;margin-top:2px}
#lvl{font-size:13px;color:var(--accent);margin-top:3px}
#map{top:12px;right:12px;width:210px;height:140px;background:var(--panel);border-radius:6px;pointer-events:none}
#mapc{width:100%;height:100%;display:block}
#lbl{top:118px;left:12px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(240,138,60,.45);background:var(--panel);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
#dn{top:170px;left:12px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(240,138,60,.45);background:var(--panel);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer} #dn:hover{border-color:var(--accent)} #dn:focus-visible{outline:3px solid var(--accent);outline-offset:2px} #travel{left:12px;right:12px;bottom:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#travel::-webkit-scrollbar{display:none}
#travel button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(240,138,60,.35);background:var(--panel);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
#travel button:hover,#lbl:hover{border-color:var(--accent)}
#travel button:focus-visible,#act:focus-visible,#lbl:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#hint{left:50%;transform:translateX(-50%);bottom:70px;background:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;text-align:center;max-width:calc(100vw - 24px);pointer-events:none;transition:opacity .3s}
#act{left:50%;transform:translateX(-50%);bottom:118px;min-height:48px;padding:0 22px;border:0;border-radius:24px;background:var(--accent);color:#1c1612;font:800 16px Archivo,Inter,sans-serif;font-stretch:112%;cursor:pointer}
#act[hidden],#joy[hidden]{display:none}
#joy{left:18px;bottom:72px;width:120px;height:120px;border-radius:50%;background:rgba(28,22,18,.55);border:2px solid rgba(240,138,60,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--accent);opacity:.85}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
@media(max-width:600px){#map{width:150px;height:100px}#zone{font-size:18px}#card{max-width:calc(100vw - 180px)}#hint{bottom:208px}#act{bottom:150px}#lbl{top:auto;bottom:208px;left:auto;right:12px}#dn{top:auto;bottom:260px;left:auto;right:12px}}
@media(prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D walk-through of the dream lab warehouse"></canvas>

<div id="joy" class="hud" hidden><div id="knob"></div></div>

const SPOTS=[['Entrance',2,0,15.8,0],['Electronics + assembly',-25.6,0,0,PI/2],['Debugging area',-13.5,0,4.2,0],['Parts library',-24.5,0,16.75,PI],['Skatepark',-24.5,0,6.3,PI],['Fab shop',-21,0,-9.2,0],['PCB line',-8.5,0,-9.2,.2],['Server closet',-3.55,0,-9.2,0],
  ['Recording studio',2.5,0,-9.2,0],['Control room',12.6,0,-9.2,.6],['Robot arena',-2,0,5.2,0],['Film stage',10.5,0,4.2,0],['Gym',24.5,0,4.4,0],['Sauna',25.3,0,6.6,-PI/2],['Bouldering wall',26,0,-12,0],['Downstairs bathroom',21,0,-15.4,0],['Cars',20.5,0,9.2,PI],['Sim racing rig',13.6,0,9.5,PI],['Design corner',-11,0,12.4,PI],
  ['Loft: battlestations',-9.6,LY,-10.4,PI],['Loft: lounge',1,LY,-11.2,0],['Loft: kitchen',9,LY,-9.4,0],['Drinks fridge',-12.6,LY,-11.4,0],['Fireside chat',-7,LY,-12.4,0],['Bedrooms',-24.2,LY,-11.2,0],['Games + slide',16.6,LY,-12.8,-PI/2],['Roof stairs',11.9,LY,-8.95,0],['Rooftop deck',15.2,Rh,-6.0,-.785]];
const nav=$('#travel');
SPOTS.forEach(([n,x,f,z,y])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.addEventListener('click',()=>{if(ride||climb)return;P.x=x;P.z=z;P.feet=f;yaw=y;pitch=-.05;b.blur();});nav.appendChild(b);});

/* ================= slide ride ================= */
let ride=null,climb=null;
const nearSlide=()=>LV()===1&&Math.hypot(P.x-17.4,P.z+12.8)<1.6;const nearSpiral=()=>LV()===1&&Math.hypot(P.x-SPC.x,P.z-SPC.z)<2.4;const nearHut=()=>LV()===3&&Math.hypot(P.x-(SPC.x+2.2),P.z-SPC.z)<1.7;
function tryRide(){if(ride||climb)return;if(nearSlide())ride={t:0};else if(nearSpiral())climb={t:0,up:true};else if(nearHut())climb={t:0,up:false};else return;actEl.hidden=true;}
actEl.addEventListener('click',tryRide);

/* ================= day / night ================= */
let ENVM=null;const dnBtn=$('#dn');let night=false,lastRoof=null,jbT=0;
function applyDN(){const roof=LV()===3;lastRoof=roof;
  hemi.intensity=roof?(night?.1:1.0):(night?.06:.38);hemi.color.set(night?0xaab8ff:0xffe6cc);amb.intensity=night?.015:.06;
  sun.intensity=roof?(night?.18:1.7):0;sun.color.set(night?0x9fb4ff:0xfff1dc);
  PLS.forEach(p=>p.l.intensity=p.neon?(night?1.3:.25):p.b*(night?(p.fill?.38:1.7):1));roofL.forEach(r=>r.l.intensity=roof?(night?r.n:r.d):0);
  NIGHT.forEach(o=>{if(o.m.isMeshStandardMaterial)o.m.emissiveIntensity=night?o.n:o.d;else o.m.opacity=night?o.n:o.d;});
  NEONS.forEach(n=>{if(n.halo)n.halo.material.opacity=night?.55:.12;});
  winM.color.set(night?0x0b1220:0xb9d6ea);winM.emissive.set(night?0x0a1830:0x8fb8da);winM.emissiveIntensity=night?.7:.85;
  sky.material.map=night?skyNight:skyDay;sky.material.needsUpdate=true;orb.material.color.set(night?0xcfd8ff:0xfff2d8);orb.scale.setScalar(night?12:26);hills.material.color.set(night?0x161e2a:0x6f8a8f);
  if(roof){S.fog.color.set(night?0x101826:0xc9dbe6);S.fog.near=night?40:60;S.fog.far=night?150:170;}else{S.fog.color.set(0x1c1612);S.fog.near=48;S.fog.far=120;}
  R.toneMappingExposure=night?1.0:1.05;starPts.visible=night;if(!ENVM){ENVM=new Set();S.traverse(o=>{if(o.isMesh)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.isMeshStandardMaterial)ENVM.add(m);});});}ENVM.forEach(m=>m.envMapIntensity=night?(roof?.12:.2):1);dnBtn.textContent=night?'Day mode':'Night mode';dnBtn.setAttribute('aria-pressed',String(night));}
function toggleDN(){night=!night;applyDN();}
dnBtn.addEventListener('click',()=>{toggleDN();dnBtn.blur();});applyDN();
catS.mode='sleep';catS.tm=8;catS.i=0;
function catStep(dt,t){const c=catS,w=CATW[c.i],q=c.pose;let tg;
  if(c.mode==='walk'){const dx=w[0]-c.x,dz=w[1]-c.z,d=Math.hypot(dx,dz),th=Math.atan2(dx,dz);let da=th-c.h;da=Math.atan2(Math.sin(da),Math.cos(da));c.h+=Math.max(-dt*3,Math.min(dt*3,da));
    const sp=Math.abs(da)<.6?.55:.12;c.x+=Math.sin(c.h)*sp*dt;c.z+=Math.cos(c.h)*sp*dt;c.ph+=dt*sp*17;
    if(d<.12){if(w[2]){c.mode=w[2];c.tm=w[3];}else c.i=(c.i+1)%CATW.length;}tg={by:.2,bp:0,fl:0,hl:0,hp:0,eye:1};}
  else{c.tm-=dt;if(c.tm<=0){c.mode='walk';c.i=(c.i+1)%CATW.length;}tg=c.mode==='sit'?{by:.17,bp:-.5,fl:.5,hl:-1.0,hp:.45,eye:1}:{by:.1,bp:0,fl:-1.45,hl:-1.45,hp:.25,eye:.12};}
  for(const k in tg)q[k]+=(tg[k]-q[k])*Math.min(1,dt*4);
  cat.root.position.set(c.x,0,c.z);cat.root.rotation.y=c.h;cat.body.position.y=q.by;cat.body.rotation.x=q.bp;const wa=c.mode==='walk'?1:0;
  cat.legs.forEach((l,i)=>{l.rotation.x=(i<2?q.fl:q.hl)+wa*Math.sin(c.ph+(i===0||i===3?0:PI))*.45;});
  let hy=0;const dxp=cam.position.x-c.x,dzp=cam.position.z-c.z;if(Math.hypot(dxp,dzp)<3.5&&LV()===0&&c.mode!=='sleep'){let a=Math.atan2(dxp,dzp)-c.h;a=Math.atan2(Math.sin(a),Math.cos(a));hy=Math.max(-.9,Math.min(.9,a));}
  cat.head.rotation.y+=(hy-cat.head.rotation.y)*Math.min(1,dt*3);cat.head.rotation.x=q.hp;const bl=Math.sin(t*.7)>.985?.15:1;cat.eyes.forEach(e=>e.scale.y=Math.min(q.eye,bl));
  cat.tail.forEach((s2,i)=>{s2.rotation.x=(i===0?(c.mode==='sleep'?-1.9:-.9):(c.mode==='sleep'?.05:.14))+Math.sin(t*2+i*.6)*.05;s2.rotation.z=Math.sin(t*(wa?3:1.2)-i*.5)*(c.mode==='sleep'?.3:.18);});}

/* ================= loop ================= */
let last=performance.now(),fr=0,ledT=0,lastZone='';
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function move(dt){let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyD||keys.ArrowRight)s++;if(keys.KeyA||keys.ArrowLeft)s--;
  f+=joy.y;s+=joy.x;const L=Math.hypot(f,s);if(L>1){f/=L;s/=L;}const v=(keys.ShiftLeft||keys.ShiftRight)?6.5:3.4,sy=Math.sin(yaw),cy=Math.cos(yaw);
  const dx=(-sy*f+cy*s)*v*dt,dz=(-cy*f-sy*s)*v*dt;if(!blocked(P.x+dx,P.z))P.x+=dx;if(!blocked(P.x,P.z+dz))P.z+=dz;
  const g=groundY(P.x,P.z,P.feet);P.feet+=(g-P.feet)*Math.min(1,dt*(g<P.feet-1?5:14));if(Math.abs(g-P.feet)<.002)P.feet=g;}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(ride){ride.t=Math.min(1,ride.t+dt/4.5);slide.getPointAt(ride.t,tmp);slide.getPointAt(Math.min(1,ride.t+.03),tmp2);P.x=tmp.x;P.z=tmp.z;P.feet=Math.max(0,tmp.y-.35);
    if(tmp2.distanceTo(tmp)>1e-4)yaw=Math.atan2(-(tmp2.x-tmp.x),-(tmp2.z-tmp.z));cam.position.set(tmp.x,tmp.y+.8,tmp.z);cam.lookAt(tmp2.x,tmp2.y+.75,tmp2.z);
    if(ride.t>=1){P.x=22.1;P.z=-9.6;P.feet=0;yaw=PI;pitch=0;ride=null;}}
  else if(climb){climb.t=Math.min(1,climb.t+dt/(climb.up?6:5));const u=climb.up?climb.t:1-climb.t,ua=climb.up?Math.min(1,u+.02):Math.max(0,u-.02);climbC.getPointAt(u,tmp);climbC.getPointAt(ua,tmp2);P.x=tmp.x;P.z=tmp.z;P.feet=tmp.y;
    const ey=tmp.y+1.6;cam.position.set(tmp.x,ey,tmp.z);if(tmp2.distanceTo(tmp)>1e-4){cam.lookAt(tmp2.x,ey+(tmp2.y-tmp.y)*.5,tmp2.z);yaw=Math.atan2(-(tmp2.x-tmp.x),-(tmp2.z-tmp.z));}
    if(climb.t>=1){if(climb.up){P.x=SPC.x+2.2;P.z=SPC.z;P.feet=Rh;yaw=-PI/2;}else{P.x=SPC.x;P.z=SPC.z+1.55;P.feet=LY;yaw=PI/2;}pitch=0;climb=null;}}
  else{move(dt);cam.rotation.order='YXZ';cam.position.set(P.x,P.feet+1.65,P.z);cam.rotation.set(pitch,yaw,0);}
  sky.position.copy(cam.position);if((LV()===3)!==lastRoof)applyDN();jbT+=dt;if(jbT>9){jbT=0;jbNow.next();}
  if(!RM){FLAMES.forEach((f,i)=>{f.scale.y=.8+.35*Math.sin(t*9+i*1.7)+.15*Math.sin(t*23+i);f.rotation.y=t*2+i;});bubM.emissive.setHSL((t*.04)%1,.95,.5);bubM.color.copy(bubM.emissive);catStep(dt,t);}
  else if(fr===0)catStep(.016,0);
  if(!RM){const a=t*.55;dogG.position.set(-2+1.6*Math.cos(a),0,1.2+1.6*Math.sin(a));dogG.rotation.y=-a-PI/2;dogLegs.forEach((l,i)=>l.rotation.z=-.3+Math.sin(t*9+(i===0||i===3?0:PI))*.35);
    dogLabel.position.set(dogG.position.x,1.1,dogG.position.z);hexLegs.forEach((l,i)=>l.rotation.z=Math.sin(t*6+i*PI/3)*.25);hexG.rotation.y=Math.sin(t*.4)*.6;
    urCam.base.rotation.y=Math.sin(t*.35)*1.1;urCam.sh.rotation.x=-.35+Math.sin(t*.6)*.25;urCam.el.rotation.x=.9+Math.sin(t*.8)*.3;}
  ledT+=dt;if(ledT>.15){ledT=0;for(let i=0;i<8;i++){const l=leds[(Math.random()*leds.length)|0];l.material.emissiveIntensity=l.material.emissiveIntensity>.5?.1:1;}}
  if((fr++&7)===0){if(lblOn)for(const l of labels)l.visible=l.position.distanceToSquared(cam.position)>9;const lv=LV();let n=lv===3?'Rooftop':'Main floor';for(const z of ZN)if((z.l===lv||(z.l===2&&lv<3))&&P.x>=z.x1&&P.x<=z.x2&&P.z>=z.z1&&P.z<=z.z2){n=z.n;break;}
    if(ride)n='Wheee! Riding the slide';if(climb)n=climb.up?'Climbing to the rooftop':'Heading back down';if(n!==lastZone){zoneEl.textContent=n;lastZone=n;}lvlEl.textContent=ride?'Going down':climb?'Spiral stairs':lv===3?'Rooftop · 10 m up':lv?'Loft level · 4 m up':'Ground level';
    {const ak=ride||climb?null:nearSlide()?'slide':nearSpiral()?'up':nearHut()?'down':null;actEl.hidden=!ak;if(ak&&actEl.dataset.k!==ak){actEl.dataset.k=ak;actEl.textContent={slide:'Ride the slide ↓',up:'Climb to the rooftop ↑',down:'Back down to the loft ↓'}[ak];}}drawMap();}
  R.render(S,cam);}
requestAnimationFrame(frame);
window.__dl={P,cols,get yaw(){return yaw},set yaw(v){yaw=v},get pitch(){return pitch},set pitch(v){pitch=v},R,S,cam,catS,cat};
}
